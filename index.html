<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethlumia</title>
    <!-- Importing a professional modern tech font -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(at 50% 50%, rgba(13, 24, 43, 0.5) 0px, transparent 50%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 255, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 4px, 100% 100%;
        }
        .container {
            text-align: center;
            position: relative;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #00ffff;
            text-shadow: 
                0 0 5px #00ffff, 
                0 0 10px #00ffff, 
                0 0 20px #002244,
                0 0 40px #ff007f;
            animation: glitch 3s infinite alternate;
            margin-bottom: 20px;
        }
        .enter-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #ff007f;
            text-decoration: none;
            text-transform: uppercase;
            border: 2px solid #ff007f;
            background: transparent;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }
        .enter-btn:hover {
            color: #05050a;
            background-color: #ff007f;
            box-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f;
            text-shadow: none;
        }
        @keyframes glitch {
            0% { text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff; }
            50% { text-shadow: 0 0 3px #00ffff, 0 0 15px #ff007f; }
            100% { text-shadow: 0 0 8px #00ffff, 0 0 12px #00ffff; }
        }
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; letter-spacing: 4px; }
            .enter-btn { font-size: 1rem; padding: 10px 30px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Brand Title -->
        <h1>Aethlumia</h1>
        
        <!-- Action Button Link targeting your specific Canva Site -->
        <a href="https://aethlumia.my.canva.site/aethlumia" class="enter-btn">ENTER</a>
    </div>

</body>
</html>
